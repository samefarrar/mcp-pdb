[project]
name = "mcp-pdb"
version = "0.7.0"
description = "MCP to use the python debugger, inspired by debug-gym"
readme = "README.md"
authors = [
    { name = "samefarrar", email = "67292186+samefarrar@users.noreply.github.com" },
]
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=1.6.0,<2", "remote-pdb>=2.1.0"]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
mcp-pdb = "mcp_pdb:main"
rpdb = "mcp_pdb.rpdb:main"

[dependency-groups]
dev = ["pytest>=8.0.0", "pyright>=1.1.400", "ruff>=0.11.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM", "PT", "RUF", "T20", "TC", "C4", "PIE"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# main.py must never print (stdout is the MCP JSON-RPC channel); rpdb is a CLI.
"src/mcp_pdb/rpdb.py" = ["T20"]
"tests/**" = ["T20"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
